<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>

  
  <img id="top" src="./images/bg-pattern-top.svg" alt="">
  <img id="bottom" src="./images/bg-pattern-bottom.svg" alt="">

  
  <div id="card">
    
    
    <div id="background">
      <img src="./images/bg-pattern-card.svg" alt="">
    </div>

    
    <img id="victor" src="./images/image-victor.jpg" alt="">

    <div id="name">
      Victor Crest <span id="age">26</span>
    </div>

    
    <div id="London">London</div>

    
    <div id="line"></div>

    
    <div id="social">
      <div class="stats">
        <p class="number">80K</p>
        <p class="label">Followers</p>
      </div>

      <div class="stat-box">
        <p class="number">803K</p>
        <p class="label">Likes</p>
      </div>

      <div class="stats">
        <p class="number">1.4K</p>
        <p class="label">Photos</p>
      </div>
    </div>

  </div>

</body>
</html>
