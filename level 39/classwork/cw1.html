<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <div class="ddd"></div>
    <div class="ttt">
      <div class="idk num">7</div>
      <div class="idk num">8</div>
      <div class="idk num">9</div>
      <div class="idk op">+</div>

      <div class="idk num">4</div>
      <div class="idk num">5</div>
      <div class="idk num">6</div>
      <div class="idk op">-</div>

      <div class="idk num">1</div>
      <div class="idk num">2</div>
      <div class="idk num">3</div>
      <div class="idk op">x</div>

      <div class="idk clear">C</div>
      <div class="idk num">0</div>
      <div class="idk op">=</div>
      <div class="idk op">/</div>
    </div>
  </div>

</body>
</html>
