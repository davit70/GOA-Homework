<!-- 3) შექმენით 1 html-ის ფაილი, რომელშიც თავისმხრივ შექმნით რამდენიმე პარაგრაფს (p), თქვენი დავალებაა გასტილოთ ეს პარაგრაფები inline css-ის მეშვეობით. გამოიყენეთ css-ში მთლიანად ნასწავლი მასალა. -->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: darkblue; text-align: center;">Hello World!</h1>

    <p style="color: red; font-size: 20px;">Hello World!</p>

    <p style="color: green; background-color: lightyellow; font-size: 18px;">Hello World!</p>

    <p style="color: white; background-color: black; text-align: center;">Hello World! </p>

    <p style="font-size: 22px; font-family: Arial; color: purple;">Hello World!</p>

    <p style="color: orange; background-color: lightgray; text-align: right; font-size: 16px;">Hello World!</p>

    
</body>
</html>
