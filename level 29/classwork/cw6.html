<!-- 6) შექმენი h1, მიეცი id: title, class: red-text. კლასით ტექსტის ფერი გახადე წითელი, id-ით გახადე ლურჯი, რა ფერის იქნება h1 და რატომ? -->

<!DOCTYPE html>
<html>
<head>
    <title>ID vs Class</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title" class="red-text">Hello World</h1>

</body>
</html>

<!-- ლურჯი იქნება რადგან id-ს უფრო მაღალი პრიორიტეტი  აქვს ვიდრე class -->
