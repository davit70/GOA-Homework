<!-- 2) შექმენი საიტის ზედა ნაწილი <header> თეგით. შიგნით ჩასვი სათაური <h1> საიტის სახელით. style ატრიბუტით მისცემ სათაურს წითელი ფერი,
     ცენტრში სწორება (text-align) და შემოავლე წყვეტილი ჩარჩო (border: 2px dashed black;). -->



     <!-- 3) შექმენი სექცია <section>, რომლის შიგნითაც მოათავსებ სტატიას <article>. სტატიაში ჩასვი სათაური "თავი 1" და ერთი აბზაცი <p> ტექსტით. 
        style ატრიბუტით შეუცვალე მთლიან სექციას ფონის ფერი (background-color),
         ხოლო აბზაცის ტექსტის ფონტი გახადე დიდი (font-size: 24px;). -->

     <!DOCTYPE html>
     <html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>group 101</title>
     </head>
     <body>
        <header>
            <h1 style="color: red; text-align: center; border: 2px dashed black;" >Hello World</h1>
        </header>
        <section style="background-color: darkred;">
            <article>
                <h1>თავი 1</h1>
                <p style="font-size: 24px;">„საღამო ჟამი იყო. მზე ჯერ კიდევ ებრძოდა შემოდგომის სუსხს, მაგრამ მისი სხივები უკვე ფითულად ეფინებოდა მუხნარს. ჯაყო იდგა თავისი ქოხის წინ და უყურებდა, როგორ იძირებოდა ბუნება მშვიდ, იისფერ ბინდში. მის თვალებში რაღაც ველური, პირველყოფილი სევდა კრთოდა.“</p>
    
            </article>
        </section>
        
     </body>
     </html>
